<!DOCTYPE html>
<html>

<head>
  <meta charset='utf-8'>
  <title>Study Making Web With DjangoPython</title>
  <h1>Django</h1>
  <hr>
</head>

<body>
  {% include 'navbar.html' %}

  {% if messages %}
<ul class="messages">
    {% for message in messages %}
    <li {% if message.tags %} 
      class="{{ message.tags }}"
      {% endif %}>
      {{ message }}
    </li>
  {% endfor %}
</ul>
{% endif %}

  {% block content %}

  {% endblock %}

</body>
</html>
