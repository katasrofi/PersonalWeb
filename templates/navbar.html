<form 
  method="GET" 
  action="{% url 'HOME' %}">

  <!-- Search Form -->
  <input 
    type="text" 
    name="q" 
    placeholder="Search"
  />

</form>

{% if request.user.is_authenticated %}
<p>Hello {{request.user}}</p>
<a href="{% url 'LOGOUT' %}">
  Logout
</a>

{% else %}
<a href="{% url 'LOGIN' %}">
  Login
</a>

{% endif %}
