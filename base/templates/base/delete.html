{% extends 'main.html' %}

{% block content %}

<form method="POST" action="">
    {% csrf_token %}
    <p>
        Are you sure want to delete "{{obj}}" profile?
    </p>
    
    <!-- Cancel Button -->
    <a href="{{request.META.HTTP_REFERER}}">
        Cancel
    </a>
    
    <!-- Submit Button -->
    <input 
        type="submit" 
        value="Confirm" 
    />
</form>

{% endblock content %}
